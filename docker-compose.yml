# Optional local stack. The browser calls the published API port.
services:
  api:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - errno-data:/data
    ports:
      - "8000:8000"
  web:
    image: node:22-slim
    working_dir: /web
    volumes:
      - ./vita-astronaut-health-monitor/frontend:/web
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"

volumes:
  errno-data:
